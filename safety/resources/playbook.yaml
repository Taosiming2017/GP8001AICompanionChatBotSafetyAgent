# Self-regulation playbook (Level 2). One prompt is offered at a time and the
# prompts rotate within a session. Plain, literal language; the user always has a
# way to stop. These are practice-tool prompts, not therapy.
level2_prompts:
  - id: slow_breathing
    text: |-
      Let's pause the practice. You did nothing wrong.
      Would you like to try slow breathing?
      Breathe in while you count 1, 2, 3, 4.
      Breathe out while you count 1, 2, 3, 4, 5, 6.
      You can do this 3 times.
    choices: ["I did it", "Something else", "Stop for today"]
  - id: name_the_feeling
    text: |-
      Let's pause the practice. You did nothing wrong.
      Can you pick a word for how you feel right now?
    choices: ["Tired", "Worried", "Angry", "Too loud or too much", "Something else"]
  - id: sensory_break
    text: |-
      Let's pause the practice. You did nothing wrong.
      You can take a short break. Look away from the screen, drink some water, or go somewhere quiet.
      I will wait here. There is no rush.
    choices: ["I am back", "Stop for today"]

# Extra instructions appended to the companion prompt for Level 1 (tense).
level1_directives:
  - "The user may feel tense. Slow down."
  - "Use 1 or 2 short sentences. Keep each sentence under 12 words."
  - "Ask at most one question."
  - "Offer two choices: keep going, or take a short break."
  - "Do not give feedback on this turn."
level1_choices: ["Keep going", "Take a short break"]

# Instructions for the companion while the session is in crisis support mode
# (after a crisis message, until the user chooses to go back to practice).
crisis_support_directives:
  - "Stay out of the role-play. Do not give feedback."
  - "Reply in 1 to 3 short, kind sentences. Use plain, literal words."
  - "Do not give advice about medicine, diagnosis or methods of harm."
  - "Do not promise to keep secrets."
  - "End with this exact sentence: {support_line}"

# Fixed replies when the user presses a button (demo/orchestrator.py). Keys are the exact
# button labels used above and in helplines.yaml. `call` is a SafetyAgent method to run first.
# {support_line} is filled from helplines.yaml and is also appended while a crisis hold is on.
events:
  "I am safe now. Go back to practice":
    call: release_crisis_hold
    text: "Okay. I am glad you are safe. We can go back to practice. Take your time."
  "Keep talking with you":
    text: "I am here. You can tell me what is on your mind."
    choices: ["Stop for today", "I am safe now. Go back to practice"]
  "Stop for today":
    end: true
    text: "Okay. We stop here for today. Thank you for talking with me."
  "Take a short break":
    text: |-
      Okay. Let's take a short break.
      Look away from the screen, drink some water, or go somewhere quiet.
      I will wait here. There is no rush.
    choices: ["I am back", "Stop for today"]
  "I am back":
    call: user_chose_continue
    text: "Welcome back. We can continue when you are ready."
  "I did it":
    call: user_chose_continue
    text: "Thank you for trying it. What would you like to do now?"
    choices: ["Go back to practice", "Take a short break", "Stop for today"]
  "Keep going":
    call: user_chose_continue
    text: "Okay. Let's keep going."
  "Go back to practice":
    call: user_chose_continue
    text: "Okay. Let's go back to practice. Say the next thing when you are ready."
  "Something else":
    next_prompt: true        # offer the next Level 2 prompt from the list above
  feelings:                  # the answers to the name_the_feeling prompt
    labels: ["Tired", "Worried", "Angry", "Too loud or too much"]
    text: "Thank you for telling me. It is okay to feel like that. What would you like to do now?"
    choices: ["Take a short break", "Go back to practice", "Stop for today"]
